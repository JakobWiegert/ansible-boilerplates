---
- name: Update Packages
  hosts: all
  become: true

  tasks:
    - name: Update Apt
      when: ansible_pkg_mgr == 'apt'
      ansible.builtin.apt:
        update_cache: true

    - name: Upgrade Apt
      when: ansible_pkg_mgr == 'apt'
      ansible.builtin.apt:
        upgrade: dist

    - name: Update APK
      when: ansible_pkg_mgr == 'apk'
      conmmunity.general.apk:
        update_cache: true

    - name: Upgrade APK
      when: ansible_pkg_mgr == 'apk'
      conmmunity.general.apk:
        available: true
        upgrade: true
