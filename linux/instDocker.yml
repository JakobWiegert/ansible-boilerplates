---
- name: Install Docker Ubuntu
  hosts: docker
  vars:
    #change the username to your username
    username: jakob
  become: true

  tasks:
    - name: Install docker dependencies apt
      when: ansible_pkg_mgr == 'apt'
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg-agent
          - software-properties-common
          - python3-pip
        update_cache: true

    - name: Add docker gpg key apt
      when: ansible_pkg_mgr == 'apt'
      ansible.builtin.apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present
        keyring: /etc/apt/keyrings/docker.gpg

    - name: Add docker repository apt
      when: ansible_pkg_mgr == 'apt'
      ansible.builtin.apt_repository:
        filename: docker
        repo: deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu {{ ansible_lsb.codename | lower }} stable
        state: present

    - name: Install docker engine apt
      when: ansible_pkg_mgr == 'apt'
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        update_cache: true

    - name: install docker apk
      when: ansible_pkg_mgr == 'apk'
      community.general.apk:
          name: docker
          update_cache: true
          state: latest

    - name: create docker group
      group:
        name: docker
        state: present

    - name: adding existing user '{{ username }}' to group docker
      user:
        name: "{{username}}"
        groups: docker
        append: yes
